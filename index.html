<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Mr. Vibe AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                DEFAULT: '#8b5cf6',
                dark: '#0b0713',
                card: '#1c152a',
                input: '#241a37',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 3s ease-in-out infinite',
              'vibe-in': 'vibe-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'fade-in': 'fade-in 0.3s ease-out forwards',
              'shake': 'shake 0.5s ease-in-out infinite',
              'confetti': 'confetti 2s ease-out forwards',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shake: {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '25%': { transform: 'translateY(-15px) rotate(-5deg)' },
                '75%': { transform: 'translateY(15px) rotate(5deg)' },
              },
              'vibe-in': {
                '0%': { opacity: '0', transform: 'translateY(10px) scale(0.95)' },
                '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
              },
              'fade-in': {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              'confetti': {
                '0%': { transform: 'translateY(0) scale(1)', opacity: '1' },
                '100%': { transform: 'translateY(-100px) scale(0)', opacity: '0' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --app-height: 100%;
      }
      /* Prevent FOUC by setting a background matching the user preference or default */
      html {
        background-color: #f8fafc;
      }
      html.dark {
        background-color: #0b0713;
      }
      html, body {
        height: 100%;
        overflow: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      body {
        background: transparent;
        color: #0f172a;
      }
      html.dark body {
        color: white;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      .ios-safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
      .ios-safe-top { padding-top: env(safe-area-inset-top); }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      html.dark .glass-card {
        background: rgba(28, 21, 42, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .tab-bar {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-top: 1px solid rgba(0, 0, 0, 0.05);
      }
      html.dark .tab-bar {
        background: rgba(11, 7, 19, 0.9);
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .xp-badge {
        background: linear-gradient(90deg, #8b5cf6 0%, #d946ef 100%);
      }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      html.dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #332747; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Smoothly transition all color properties */
      *, *::before, *::after {
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
